# vm/data_acl.conf (2026-11-21): owners, modes and ACLs of the data folders on so-vm (design section 3, decisions of
# 2026-11-18 and 2026-11-19). Read by vm/data_acl.sh (vm/setup_vm.sh step 5, vm/set_data_permissions.sh) and by
# vm/check_data_permissions.py, so the rules exist once.
#
# One managed folder per line, parents before children:
#   path|owner:group|mode|access entries (added to the mode's own three)|default entries (empty: none)
#
# Below a managed folder (what a copy brings, or what an account creates later), every item gets what inheritance from
# the folder's default ACL gives: folders the default entries as access and default ACL (plus the setgid bit when the
# managed folder has it), files the default entries without x. Without default entries: folders the managed folder's
# mode, files that mode without x. The owner and group are the managed folder's. A deeper managed folder has its own
# line and is not "below" its parent.

# The data root: nico and the runner read; so_agent and so_planner may only pass through to their grants
/srv/so/data|nico:so_data|2750|g:so_data:r-x,u:so_agent:--x,u:so_planner:--x|u::rwx,g::r-x,g:so_data:r-x,o::---
# Pipeline zones: nico writes, the runner reads
/srv/so/data/store01_rawzone|nico:so_data|2750|g:so_data:r-x|u::rwx,g::r-x,g:so_data:r-x,o::---
/srv/so/data/store02_workzone|nico:so_data|2750|g:so_data:r-x|u::rwx,g::r-x,g:so_data:r-x,o::---
/srv/so/data/store03_goldzone|nico:so_data|2750|g:so_data:r-x|u::rwx,g::r-x,g:so_data:r-x,o::---
# The experiment zone: nico and the runner read and write (as the Windows runner modifies store04 only)
/srv/so/data/store04_experiments|nico:so_data|2770|g:so_data:rwx,u:so_agent:--x,u:so_planner:--x|u::rwx,g::rwx,g:so_data:rwx,o::---
# judge/ (V reference, reset marker): written only by Nicolas's freeze_v_reference.py and reset_records.py
/srv/so/data/store04_experiments/judge|nico:so_data|2750|g:so_data:r-x|u::rwx,g::r-x,g:so_data:r-x,o::---
# The queue: nico queues, the runner runs; nobody else (so_agent has no access to queue/pending, decided 2026-11-18)
/srv/so/data/store04_experiments/queue|nico:so_data|2770|g:so_data:rwx|u::rwx,g::rwx,g:so_data:rwx,o::---
/srv/so/data/store04_experiments/queue/pending|nico:so_data|2770|g:so_data:rwx|u::rwx,g::rwx,g:so_data:rwx,o::---
/srv/so/data/store04_experiments/queue/running|nico:so_data|2770|g:so_data:rwx|u::rwx,g::rwx,g:so_data:rwx,o::---
/srv/so/data/store04_experiments/queue/rejected|nico:so_data|2770|g:so_data:rwx|u::rwx,g::rwx,g:so_data:rwx,o::---
/srv/so/data/store04_experiments/queue/done|nico:so_data|2770|g:so_data:rwx|u::rwx,g::rwx,g:so_data:rwx,o::---
/srv/so/data/store04_experiments/queue/failed|nico:so_data|2770|g:so_data:rwx|u::rwx,g::rwx,g:so_data:rwx,o::---
/srv/so/data/store04_experiments/queue/outbox|nico:so_data|2770|g:so_data:rwx|u::rwx,g::rwx,g:so_data:rwx,o::---
/srv/so/data/store04_experiments/queue/logs|nico:so_data|2770|g:so_data:rwx|u::rwx,g::rwx,g:so_data:rwx,o::---
/srv/so/data/store04_experiments/runs|nico:so_data|2770|g:so_data:rwx|u::rwx,g::rwx,g:so_data:rwx,o::---
# visible/ (state.json): both reader groups; grades/ only the planner's group; status/ only the coder's group
/srv/so/data/store04_experiments/visible|nico:so_data|2770|g:so_data:rwx,g:so_grade_readers:r-x,g:so_status_readers:r-x|u::rwx,g::rwx,g:so_data:rwx,g:so_grade_readers:r--,g:so_status_readers:r--,o::---
/srv/so/data/store04_experiments/visible/grades|nico:so_data|2770|g:so_data:rwx,g:so_grade_readers:r-x|u::rwx,g::rwx,g:so_data:rwx,g:so_grade_readers:r--,o::---
/srv/so/data/store04_experiments/visible/status|nico:so_data|2770|g:so_data:rwx,g:so_status_readers:r-x|u::rwx,g::rwx,g:so_data:rwx,g:so_status_readers:r--,o::---
# control/ (STOP): written by nico only; read by the runner, the coder and the planner
/srv/so/data/control|nico:so_data|2750|g:so_data:r-x,u:so_agent:r-x,u:so_planner:r-x|u::rwx,g::r-x,g:so_data:r--,u:so_agent:r--,u:so_planner:r--,o::---
# Quarantine and holdout: nico only
/srv/so/quarantine|nico:nico|700||
/srv/so/holdout|nico:nico|700||
