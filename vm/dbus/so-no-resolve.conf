<?xml version="1.0"?>
<!-- /etc/dbus-1/system.d/so-no-resolve.conf (vm/dbus/so-no-resolve.conf, 2026-11-19): the service accounts may not
     ask systemd-resolved for names over D-Bus (they have no DNS; tinyproxy and Postfix resolve for them). -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="so_runner"><deny send_destination="org.freedesktop.resolve1"/></policy>
  <policy user="so_agent"><deny send_destination="org.freedesktop.resolve1"/></policy>
  <policy user="so_planner"><deny send_destination="org.freedesktop.resolve1"/></policy>
  <policy user="so_git"><deny send_destination="org.freedesktop.resolve1"/></policy>
  <policy user="so_host"><deny send_destination="org.freedesktop.resolve1"/></policy>
</busconfig>
