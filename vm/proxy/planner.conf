# /etc/so/proxy/planner.conf (vm/proxy/planner.conf, 2026-11-19): tinyproxy allow-list proxy for so_planner, run by so-proxy@planner.service.
# Listens on loopback only; nftables lets only so_planner reach this port and only tinyproxy reach the internet (TCP 443).
# Every host not matched by a line of /etc/so/proxy/planner.allow is refused (FilterDefaultDeny); CONNECT only to 443.
Port 3129
Listen 127.0.0.1
Timeout 600
MaxClients 64
Allow 127.0.0.1
ConnectPort 443
Filter "/etc/so/proxy/planner.allow"
FilterDefaultDeny Yes
FilterCaseSensitive No
DisableViaHeader Yes
Syslog Off
LogLevel Notice
# Logs go to standard output in -d mode, so to the journal: journalctl -u so-proxy@<name>
