# /etc/so/proxy/git.conf (vm/proxy/git.conf, 2026-11-19): tinyproxy allow-list proxy for so_git, run by so-proxy@git.service.
# Listens on loopback only; nftables lets only so_git reach this port and only tinyproxy reach the internet (TCP 443).
# Every host not matched by a line of /etc/so/proxy/git.allow is refused (FilterDefaultDeny); CONNECT only to 443.
Port 3130
Listen 127.0.0.1
Timeout 600
MaxClients 64
Allow 127.0.0.1
ConnectPort 443
Filter "/etc/so/proxy/git.allow"
FilterDefaultDeny Yes
FilterCaseSensitive No
DisableViaHeader Yes
Syslog Off
LogLevel Notice
# Logs go to standard output in -d mode, so to the journal: journalctl -u so-proxy@<name>
