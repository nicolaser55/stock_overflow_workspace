# /etc/ssh/sshd_config.d/00-so-hardening.conf (vm/ssh/00-so-hardening.conf; step 2 version plus so_agent, 2026-11-19,
# plus so_host, 2026-11-23: its key may only run the status receiver, vm/ssh/98-so-host.conf)
# Read before every other file, so its values win (sshd keeps the first value of a keyword, gotcha #97).
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
AllowUsers nico so_agent so_host
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
