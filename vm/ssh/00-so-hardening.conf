# /etc/ssh/sshd_config.d/00-so-hardening.conf (vm/ssh/00-so-hardening.conf; step 2 version plus so_agent, 2026-11-19)
# Read before every other file, so its values win (sshd keeps the first value of a keyword, gotcha #97).
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
AllowUsers nico so_agent
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
