# /etc/ssh/sshd_config.d/98-so-host.conf (vm/ssh/98-so-host.conf, 2026-11-23)
# so_host receives the host's Windows Update facts (design section 4): nicodesktop's task "SO VM status" logs in with
# its own key (no passphrase; it runs unattended as SYSTEM). The key may only run the receiver: the forced command
# below wins over anything in the key line or the client's request, nothing is forwarded, no terminal. The key line
# itself (root-owned file, outside the account's home) also carries from="<nicodesktop's tailnet address>" and restrict.
# Check: sudo sshd -T -C user=so_host,host=x,addr=100.123.162.2
Match User so_host
    AuthorizedKeysFile /etc/so/ssh/so_host_authorized_keys
    ForceCommand /usr/local/lib/so/so-host-status
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
    X11Forwarding no
    PermitTunnel no
    MaxSessions 1
# sshd ends a Match block at the end of an included file (OpenSSH 8.2+); vm/check_vm_access.sh checks it with sshd -T
