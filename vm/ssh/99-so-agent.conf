# /etc/ssh/sshd_config.d/99-so-agent.conf (vm/ssh/99-so-agent.conf, 2026-11-19)
# so_agent logs in only from Cursor Remote-SSH on nicosls (key nicosls_sovm_agent). Cursor reaches its own server in
# the VM through a local forward, so so_agent may forward to the VM's loopback addresses and nowhere else. No agent,
# X11, unix-socket or remote forwarding; no tunnel. Check: sudo sshd -T -C user=so_agent,host=x,addr=100.98.9.22
Match User so_agent
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:* localhost:* [::1]:*
    PermitListen none
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY yes
# sshd ends a Match block at the end of an included file (OpenSSH 8.2+); vm/check_vm_access.sh checks it with sshd -T
