# /etc/systemd/system/systemd-resolved.service.d/so.conf (vm/systemd/dropins/systemd-resolved-so.conf, 2026-11-19)
# The service accounts may not open resolved's run directory (its varlink socket and stub resolv.conf), so they have
# no name lookups (nftables also refuses their port 53). Applied again at every start of resolved.
[Service]
ExecStartPost=-/usr/bin/setfacl -m u:so_runner:---,u:so_agent:---,u:so_planner:---,u:so_git:--- /run/systemd/resolve
