# /etc/systemd/system/tailscaled.service.d/so.conf (vm/systemd/dropins/tailscaled-so.conf, 2026-11-19)
# The service accounts may not use tailscaled's local socket: tailscaled runs as root, so a "tailscale nc" through it
# would reach the tailnet outside the per-account nftables rules. Applied again at every start of tailscaled.
[Service]
ExecStartPost=-/usr/bin/setfacl -m u:so_runner:---,u:so_agent:---,u:so_planner:---,u:so_git:--- /run/tailscale
